# scan.yml — scheduled job scan + email alert.
#
# Off until you set the repository variable RADAR_ENABLED=true
# (Settings → Secrets and variables → Actions → Variables), so the public
# template never runs a scan by itself. Full setup: docs/DEPLOYMENT.md.
name: scan

on:
  schedule:
    - cron: "7 * * * *"           # hourly, employer boards only ($0)
    - cron: "37 13,17,21 * * *"   # 3x/day (9:37am, 1:37pm, 5:37pm EDT), adds LinkedIn/Indeed via Apify
  workflow_dispatch:
    inputs:
      apify:
        description: "Include LinkedIn/Indeed (Apify, up to $0.10)"
        type: boolean
        default: false
      preset:
        description: "Scan preset (run, faang, local, remote, ...)"
        type: string
        default: run

# Runs never overlap: they share state/ and would race on the commit-back.
concurrency:
  group: scan
  cancel-in-progress: false

permissions:
  contents: write                 # commit state/ back to the repo

jobs:
  scan:
    if: vars.RADAR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_TO: ${{ secrets.ALERT_TO }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      RADAR_APIFY: ${{ (github.event.schedule == '37 13,17,21 * * *' || inputs.apify) && '1' || '0' }}
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci --omit=dev

      - name: Check configuration
        run: |
          if [ ! -f config/profile.yml ] || [ ! -f config/portals.yml ]; then
            echo "::error::config/profile.yml and config/portals.yml are missing. In your private copy run: git add -f config/profile.yml config/portals.yml (docs/DEPLOYMENT.md, step 3)."
            exit 1
          fi

      # Public ATS company lists, refreshed at most once a day by the scanner.
      - uses: actions/cache@v4
        with:
          path: state/cache
          key: ats-lists-${{ github.run_id }}
          restore-keys: ats-lists-

      - name: Scan and alert
        id: alert
        env:
          PRESET: ${{ inputs.preset || 'run' }}   # via env, never inlined into the script
        run: node src/main.mjs --preset "$PRESET"

      # Runs even when the email failed (exit 2), so undelivered jobs are kept.
      - name: Save state
        if: always() && steps.alert.outcome != 'skipped'
        run: |
          git config user.name "job-radar"
          git config user.email "job-radar@users.noreply.github.com"
          for f in state/job-seen.json state/discovery-state.json state/alerts.json state/dead-boards.tsv; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --cached --quiet; then echo "No state changes."; exit 0; fi
          git commit -m "chore(state): scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            sleep $((i * 5))
          done
          echo "::error::Could not push state after 3 attempts."
          exit 1
