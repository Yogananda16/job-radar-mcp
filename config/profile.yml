# ── Locations ───────────────────────────────────────────────────────────────
# Preferred locations score higher (remote always scores highest). Which
# locations are allowed at all is set in portals.yml → location_filter.
locations:
  preferred: ["connecticut", "ct", "new york", "ny", "nyc", "new jersey", "nj", "boston", "massachusetts", "ma", "cambridge", "stamford", "hartford", "new haven", "west haven", "jersey city", "newark", "hoboken", "princeton"]

# ── Salary ($K per year) ────────────────────────────────────────────────────
salary:
  good_k: 110        # at or above → full salary points
  fair_k: 90

# ── Eligibility (hard filters) ──────────────────────────────────────────────
# A posting that breaks one of these is BLOCKED and never reaches your alert.
# Ambiguous wording is marked VERIFY instead, so you can check it yourself.
eligibility:
  needs_sponsorship: true        # block "no sponsorship now or in the future"
  on_opt: true                   # block postings that exclude OPT / CPT
  us_citizen: false              # true skips all citizenship and clearance rules
  graduated: true                # block "must be currently enrolled"
  graduation: "2026-05"          # block postings needing a later graduation date
  max_years_required: 5          # block postings asking for more years
  salary_floor_k: 70             # block when the stated maximum is below this
  block_local_only: true         # block "local candidates only / no relocation"
  excluded_title_words: [staff, principal, director, head of, vice president, vp, manager, distinguished, fellow]

# ── Alerts ──────────────────────────────────────────────────────────────────
# Credentials never go here. They come from environment variables / GitHub
# secrets: GMAIL_USER, GMAIL_APP_PASSWORD, ALERT_TO (see docs/DEPLOYMENT.md).
alerts:
  email:
    enabled: true
    min_fit: 3.5                 # only jobs at or above this fit score
    include_verify: true         # also send jobs whose eligibility says VERIFY
    subject_prefix: "[job-radar]"

# ── AI summary (optional) ───────────────────────────────────────────────────
# Adds a two-line "why you fit / main gap" note per job in the alert, written
# by Claude from the job text and this profile. Off unless ANTHROPIC_API_KEY
# is set. One request per alert email, on the final shortlist only (≤10 jobs).
# Cost per alert: claude-opus-5-5 ≈ $0.08 · claude-haiku-5-5 ≈ $0.002 (docs/COST.md).
ai:
  enabled: true
  model: claude-haiku-5-5        # low-cost default (≈ $0.002/alert); or claude-sonnet-5-5 / claude-opus-5-5
  max_jobs: 10

# ── Scan settings ───────────────────────────────────────────────────────────
# Guardrails (time, cost, concurrency) are clamped in code: values here can
# only make a scan smaller or cheaper. See docs/GUARDRAILS.md.
discovery:
  rotationBatch: 25
  strongFit: 4
  apify:
    enabled: true
    scanCapUsd: 0.1
    perRunCapUsd: 0.01
    queries:
      primary:
        - AI Engineer
        - Machine Learning Engineer
        - Data Scientist
      secondary:
        - Data Engineer
        - Data Analyst
      adjacent:
        - Business Analyst
  presets:
    faang:
      companies:
        - Meta
        - Google
        - Amazon
        - Apple
        - NVIDIA
        - Microsoft
    staffing:
      companies:
        - Experis
    local:
      locations:
        - Connecticut
        - New York
        - New Jersey
        - Massachusetts
      includeRemote: true
    ct:
      description: Connecticut only (no remote)
      locations:
        - Connecticut
      includeRemote: false
      overrides:
        apify:
          actors:
            linkedin:
              input:
                location: Connecticut, United States
            indeed:
              input:
                country: us
                datePosted: '1'
                location: Connecticut
  companyBoards:
    JPMorganChase:
      - careers_url: https://jpmc.fa.oraclecloud.com/hcmUI/CandidateExperience/en/sites/CX_2001/jobs
    Uber:
      - careers_url: https://iaziqy.fa.ocs.oraclecloud.com/hcmUI/CandidateExperience/en/sites/UberCareers/jobs
