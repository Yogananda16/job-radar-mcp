# PRIVATE — your real profile. Git-ignored in the public template.
# profile.yml — who you are, what you want, and how job-radar should behave.
#
# Copy to config/profile.yml and edit. Every field is optional: anything you
# leave out falls back to the default shown here. Full reference:
# docs/CONFIGURATION.md.

candidate:
  name: "Yogananda"                 # used in the alert email greeting only

# ── Target roles ────────────────────────────────────────────────────────────
# Checked top to bottom; the first match decides the title part of the fit
# score. tier: primary (5) · secondary (4) · adjacent (3), or set score.
# Keywords are case-insensitive phrases; wrap one in /slashes/ for a regex.
roles:
  - label: "AI/GenAI Eng"
    tier: primary
    keywords: ["ai engineer", "ai developer", "genai", "generative ai", "llm", "agentic", "applied ai"]
  - label: "ML Eng"
    tier: primary
    keywords: ["machine learning", "ml engineer", "mlops", "nlp engineer", "deep learning"]
  - label: "Data Scientist"
    tier: primary
    keywords: ["/data scien\\w*/", "/applied scien\\w*/", "research scientist"]
  - label: "Data Eng"
    tier: secondary
    keywords: ["/data engineer\\w*/", "analytics engineer", "etl"]
  - label: "Data/BI Analyst"
    tier: secondary
    keywords: ["data analyst", "bi analyst", "business intelligence", "product analyst"]
  - label: "Business Analyst"
    tier: adjacent
    keywords: ["business analyst", "systems analyst"]

# ── Skills ──────────────────────────────────────────────────────────────────
# Matched against each job description (30% of the fit score). If you leave
# this out, job-radar reads the "## Skills" section of config/cv.md instead.
