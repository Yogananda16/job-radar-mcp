  - "LLMs"
  - "Open-Source LLMs"
  - "Gemini"
  - "Google ADK"
  - "LangChain"
  - "Agentic AI"
  - "Multi-Agent Systems"
  - "RAG"
  - "Vector Databases"
  - "Vector Search"
  - "ChromaDB"
  - "Prompt Engineering"
  - "Tool Calling"
  - "Human-in-the-Loop AI"
  - "AWS"
